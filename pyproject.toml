[project]
name = "lucrium-panel"
version = "0.1.2"
description = "Lucrium Panel — десктоп-панель управления воркером (FastAPI + React)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "nechel12" }]
dependencies = [
    "fastapi>=0.115",
    "lucrium-protocol",
    "platformdirs>=4.3",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3"]
build = ["pyinstaller>=6.11"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.uv.sources]
lucrium-protocol = { path = "../lucrium-protocol/packages/lucrium-protocol", editable = true }

[project.scripts]
lucrium-panel = "lucrium_panel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucrium_panel"]

[tool.hatch.build.targets.wheel.force-include]
"src/lucrium_panel/static" = "lucrium_panel/static"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["webview", "webview.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
